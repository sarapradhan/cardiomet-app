[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sahc-risklens"
version = "0.1.0"
description = "Responsible cardiometabolic benchmarking for South Asian heart health"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","W","I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that boot a real uvicorn server (deselect with '-m \"not e2e\"')",
    "browser: Playwright UI tests that build the static export and drive the app (deselect with '-m \"not browser\"')",
]

[tool.coverage.run]
source = ["sahc_risklens"]
omit = ["tests/*","scripts/*"]
