[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiomet-lens"
version = "0.1.0"
description = "Responsible cardiometabolic benchmarking for South Asian heart health"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# Only the actual Python packages — not frontend/ (Node) or data/ (gitignored
# raw files). Flat-layout auto-discovery otherwise treats every top-level
# directory as a package and setuptools refuses to build.
include = ["sahc_risklens*", "api*", "cardiosafebench*"]

[tool.ruff]
# 120, not 100: most overages are guideline-citation strings and parametrized
# test literals that read worse hand-wrapped than left on one line.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W","I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that boot a real uvicorn server (deselect with '-m \"not e2e\"')",
    "browser: Playwright UI tests that build the static export and drive the app (deselect with '-m \"not browser\"')",
]

[tool.coverage.run]
source = ["sahc_risklens"]
omit = ["tests/*","scripts/*"]
