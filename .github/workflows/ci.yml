name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend suite (unit, integration, e2e, benchmark)
        run: python -m pytest tests/ -q --tb=short --ignore=tests/browser

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

  browser:
    name: Browser UI tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Get built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - name: Run browser suite (smoke + e2e + responsive)
        run: python -m pytest tests/browser/ -q --tb=short -p no:cacheprovider
