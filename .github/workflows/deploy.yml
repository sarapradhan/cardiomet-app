name: Deploy

# Gated on CI: this only runs after the "CI" workflow finishes successfully on
# main, so an image can no longer be published/deployed without first passing
# the backend, frontend, and browser test suites. (Previously this triggered on
# every push to main independently of CI.)
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  image:
    name: Build & publish container image
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Trigger host deploy
    runs-on: ubuntu-latest
    needs: [image]
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      # This step only runs (and only shows green) if a deploy hook is actually
      # configured. If it's missing, this step is SKIPPED rather than reporting
      # a false success — the run summary below makes the gap impossible to miss.
      - name: Trigger host deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering host deploy via deploy hook..."
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Deploy triggered."
      - name: Report deploy status
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK}" ]; then
            echo "### Deploy: triggered" >> "$GITHUB_STEP_SUMMARY"
            echo "Host deploy hook was called for ghcr.io/${{ github.repository }}:${{ github.sha }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No host deploy occurred::Image ghcr.io/${{ github.repository }}:latest was published, but RENDER_DEPLOY_HOOK is not set, so no host was actually deployed. Add the secret or point your host at the published image."
            echo "### Deploy: NOT triggered" >> "$GITHUB_STEP_SUMMARY"
            echo "Image ghcr.io/${{ github.repository }}:${{ github.sha }} was published, but **no host deploy hook is configured** — nothing was deployed. Add a \`RENDER_DEPLOY_HOOK\` secret (or equivalent) to enable auto-deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
